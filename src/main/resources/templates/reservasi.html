<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservasi Buku</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f9fafb;
        color: #1f2937;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 28px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 16px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 24px 0 12px 0;
      }
      .nav-link {
        font-size: 13px;
        color: #4b5563;
        text-decoration: none;
      }
      .nav-link:hover {
        text-decoration: underline;
      }
      .alert {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #b00020;
        padding: 12px 16px;
        border-radius: 4px;
        font-size: 14px;
        margin-bottom: 20px;
      }
      .card-bukti {
        background-color: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 6px;
        padding: 16px 20px;
        margin-bottom: 24px;
      }
      .card-bukti h3 {
        margin: 0 0 12px 0;
        font-size: 15px;
        color: #166534;
      }
      .table-detail {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .table-detail td {
        padding: 6px 0;
        border: none;
      }
      .table-detail td:first-child {
        color: #4b5563;
        width: 140px;
      }
      .table-detail td:last-child {
        font-weight: 600;
        color: #111827;
      }
      .table-list {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .table-list th,
      .table-list td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }
      .table-list th {
        background-color: #f3f4f6;
        font-weight: 600;
        color: #374151;
      }
      .empty {
        color: #6b7280;
        font-size: 14px;
        padding: 16px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Reservasi Buku</h1>
        <a class="nav-link" th:href="@{/pinjam}"
          >&larr; Kembali ke Pinjam Buku</a
        >
      </div>

      <div class="alert" th:if="${pesan}">
        <p th:text="${pesan}" style="margin: 0">Pesan</p>
      </div>

      <!-- Muncul sesaat setelah berhasil klik Ajukan Reservasi -->
      <div class="card-bukti" th:if="${reservasi}">
        <h3>Bukti Reservasi Berhasil Dibuat</h3>
        <table class="table-detail">
          <tr>
            <td>No. Reservasi</td>
            <td th:text="${reservasi.idReservasi}">R0001</td>
          </tr>
          <tr>
            <td>Anggota</td>
            <td th:text="${reservasi.anggota.nama}">Nama</td>
          </tr>
          <tr>
            <td>Buku</td>
            <td th:text="${reservasi.buku.judul}">Judul</td>
          </tr>
          <tr>
            <td>Tanggal</td>
            <td th:text="${reservasi.tanggalReservasi}">2026-10-25</td>
          </tr>
          <tr>
            <td>Status</td>
            <td th:text="${reservasi.status}">AKTIF</td>
          </tr>
        </table>
      </div>

      <h2>Daftar Riwayat Reservasi</h2>
      <p class="empty" th:if="${#lists.isEmpty(daftarReservasi)}">
        Belum ada data reservasi.
      </p>

      <table class="table-list" th:if="${!#lists.isEmpty(daftarReservasi)}">
        <thead>
          <tr>
            <th>No. Reservasi</th>
            <th>Anggota</th>
            <th>Judul Buku</th>
            <th>Tanggal</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${daftarReservasi}">
            <td th:text="${r.idReservasi}">R0001</td>
            <td th:text="${r.anggota.nama}">Nama</td>
            <td th:text="${r.buku.judul}">Judul</td>
            <td th:text="${r.tanggalReservasi}">2026-10-25</td>
            <td th:text="${r.status}">AKTIF</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
