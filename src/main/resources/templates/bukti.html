<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bukti Peminjaman</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f9fafb;
        color: #1f2937;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 28px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 20px 0;
        padding-bottom: 14px;
        border-bottom: 1px solid #e5e7eb;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin-bottom: 24px;
      }
      td {
        padding: 10px 0;
        border-bottom: 1px solid #f3f4f6;
      }
      td:first-child {
        color: #6b7280;
        width: 40%;
      }
      td:last-child {
        font-weight: 500;
        color: #111827;
      }
      .btn-back {
        display: inline-block;
        background-color: #f3f4f6;
        color: #1f2937;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        border: 1px solid #d1d5db;
      }
      .btn-back:hover {
        background-color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bukti Peminjaman</h1>
      <table>
        <tr>
          <td>No. Transaksi</td>
          <td th:text="${bukti.idTransaksi}">T0001</td>
        </tr>
        <tr>
          <td>Anggota</td>
          <td th:text="${bukti.namaAnggota}">Nama</td>
        </tr>
        <tr>
          <td>Buku</td>
          <td th:text="${bukti.judulBuku}">Judul</td>
        </tr>
        <tr>
          <td>Tanggal</td>
          <td th:text="${bukti.tanggalPinjam}">2026-10-25</td>
        </tr>
        <tr>
          <td>Status</td>
          <td th:text="${bukti.status}">DIPINJAM</td>
        </tr>
      </table>
      <a class="btn-back" th:href="@{/pinjam}">Kembali</a>
    </div>
  </body>
</html>
